<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phyphox Altimeter (15s chunks)</title>
<style>
  body{font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;margin:0;background:#f8fafc;color:#0f172a}
  .wrap{max-width:780px;margin:24px auto;padding:16px}
  .card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 8px 24px rgba(0,0,0,.06)}
  label{font-size:.9rem;color:#64748b}
  input,button{font:inherit;padding:10px 12px;border:1px solid #e2e8f0;border-radius:10px}
  button{background:#2563eb;color:#fff;border:none;cursor:pointer}
  button.ghost{background:#fff;color:#2563eb;border:1px solid #2563eb}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .stat{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed #e2e8f0}
  .stat:last-child{border-bottom:none}
  .pill{display:inline-block;padding:2px 8px;border-radius:999px;background:#eef2ff;color:#3730a3;font-size:.8rem}
  .muted{color:#64748b}
</style>
<div class="wrap">
  <div class="card">
    <h1>Phyphox Altimeter</h1>
    <div class="row">
      <div>
        <label>Phyphox base URL</label>
        <input id="base" placeholder="http://192.0.0.4:8080" />
      </div>
      <div>
        <label>Chunk period (s)</label>
        <input id="period" type="number" min="5" step="1" value="15" />
      </div>
    </div>
    <div class="row" style="margin-top:8px">
      <button id="start">Start</button>
      <button id="stop" class="ghost">Stop</button>
    </div>
    <div class="row" style="margin-top:8px">
      <button id="zero" class="ghost">Zero: OFF</button>
      <button id="pick" class="ghost">Choose log CSV (optional)</button>
    </div>
    <p class="muted" id="status">Idle.</p>

    <div class="stat"><span>Avg pressure (Pa, last chunk)</span><strong id="pavg">—</strong></div>
    <div class="stat"><span>Δh (m, baseline/zero applied)</span><strong id="dh">—</strong></div>
    <div class="stat"><span>Baseline P₀ (Pa)</span><strong id="p0">—</strong></div>
    <div class="stat"><span>Last update</span><strong id="ts">—</strong></div>

    <details style="margin-top:12px">
      <summary>Download session log (if no file chosen)</summary>
      <a id="download" download="altimeter_log.csv">Download CSV</a>
    </details>
  </div>
</div>
<script>
(() => {
  const UI = id => document.getElementById(id);
  const baseEl = UI('base'), periodEl = UI('period');
  const startBtn = UI('start'), stopBtn = UI('stop'), zeroBtn = UI('zero'), pickBtn = UI('pick');
  const pavgEl = UI('pavg'), dhEl = UI('dh'), p0El = UI('p0'), tsEl = UI('ts'), statusEl = UI('status'), dl = UI('download');

  let timer = null;
  let baselinePa = null;       // fixed baseline (set on first successful chunk, unless zero toggled later)
  let zeroMode = false;        // when ON, baseline is set to current chunk’s avg (relative mode)
  let fileHandle = null;       // chosen CSV file handle (File System Access API)
  let logBlob = new Blob(["timestamp_iso,avg_pressure_pa,delta_h_m,zero_active\n"], {type:"text/csv"});

  function setStatus(s){ statusEl.textContent = s; }

  // Helper: append to user-chosen CSV, or to in-memory blob fallback
  async function appendLog(line) {
    if (fileHandle) {
      try {
        const writable = await fileHandle.createWritable({keepExistingData: true});
        const file = await fileHandle.getFile();
        await writable.write({type:"write", position:file.size, data: line});
        await writable.close();
      } catch (e) {
        console.error(e);
        setStatus("Failed to write file; using in-memory log instead.");
        fileHandle = null;
        logBlob = new Blob([await logBlob.text(), line], {type:"text/csv"});
      }
    } else {
      logBlob = new Blob([logBlob, line], {type:"text/csv"});
      dl.href = URL.createObjectURL(logBlob);
    }
  }

  // Parse phyphox CSV export (format=2): columns start with a header line and semicolon-separated metadata; use last numeric column for pressure hPa if present
  function parsePhyphoxCSV(text) {
    // Skip metadata lines that start with '#'
    const lines = text.trim().split(/\r?\n/).filter(l => l && !l.startsWith('#'));
    if (lines.length < 2) return {cols:[], rows:[]};
    const headers = lines[0].split('\t');  // CSV export uses tabs in many builds; handle commas too
    const delim = (lines[0].includes('\t') ? '\t' : ',');
    const rows = lines.slice(1).map(l => l.split(delim).map(x => x.trim())).filter(r => r.length === headers.length);
    return {cols: headers, rows};
  }

  // Compute average of pressure column in Pa
  function averagePressurePa(table) {
    // Try to locate a "pressure" column (hPa) or a "Pressure (hPa)" name
    const idx = table.cols.findIndex(h => /pressure/i.test(h));
    if (idx < 0) return null;
    let sum = 0, n = 0;
    for (const r of table.rows) {
      const v = parseFloat(r[idx]);
      if (Number.isFinite(v)) { sum += v; n++; }
    }
    if (!n) return null;
    const avg_hPa = sum / n;
    return avg_hPa * 100.0; // hPa -> Pa
  }

  // Fetch one chunk: export CSV, compute avg, (optionally) set baseline/zero, compute Δh, then clear buffer.
  async function cycleOnce() {
    const base = baseEl.value.trim();
    if (!base) { setStatus("Enter phyphox base URL."); return; }
    try {
      // 1) CSV snapshot
      const r = await fetch(`${base}/export?format=2`, {cache:"no-store"});
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const csvText = await r.text();
      const table = parsePhyphoxCSV(csvText);
      const pAvgPa = averagePressurePa(table);
      if (pAvgPa == null) { setStatus("No pressure data yet…"); return; }

      // 2) (First time) initialize baseline if not set, or refresh when zero mode is ON
      if (baselinePa == null || zeroMode) baselinePa = pAvgPa;

      // 3) Compute Δh (linear 11.8 Pa/m)
      const dP = (baselinePa - pAvgPa);
      const dh = dP / 11.8;

      // 4) Update UI
      const now = new Date();
      pavgEl.textContent = pAvgPa.toFixed(2);
      dhEl.textContent = dh.toFixed(3);
      p0El.textContent = baselinePa.toFixed(2);
      tsEl.textContent = now.toISOString();

      // 5) Append to log CSV: timestamp, avg_pressure_pa, delta_h_m, zero_active
      await appendLog(`${now.toISOString()},${pAvgPa.toFixed(2)},${dh.toFixed(3)},${zeroMode}\n`);

      // 6) Clear phyphox buffers so the next export is a fresh 15s window
      await fetch(`${base}/control?cmd=clear`).catch(()=>{});
      setStatus("OK");
    } catch (e) {
      console.error(e);
      setStatus("Fetch failed. Check phyphox URL / Wi-Fi / Remote access.");
    }
  }

  startBtn.addEventListener('click', () => {
    if (timer) return;
    const period = Math.max(5, parseInt(periodEl.value)||15) * 1000;
    setStatus("Running…");
    cycleOnce(); // run immediately
    timer = setInterval(cycleOnce, period);
  });

  stopBtn.addEventListener('click', () => {
    if (timer) { clearInterval(timer); timer = null; setStatus("Stopped."); }
  });

  zeroBtn.addEventListener('click', () => {
    zeroMode = !zeroMode;
    zeroBtn.textContent = `Zero: ${zeroMode ? 'ON' : 'OFF'}`;
    // When toggled ON, next cycle sets baseline to current avg.
  });

  pickBtn.addEventListener('click', async () => {
    try {
      // Ask user once for a CSV file to append to
      if (!('showSaveFilePicker' in window)) {
        alert("Your browser doesn’t support the File System Access API. Use the Download link instead.");
        return;
      }
      const handle = await window.showSaveFilePicker({
        suggestedName: `altimeter_log_${new Date().toISOString().replace(/[:.]/g,'-')}.csv`,
        types: [{description:"CSV", accept:{'text/csv':['.csv']}}]
      });
      fileHandle = handle;
      // Initialize header
      await appendLog(""); // no-op to ensure handle works
      await appendLog(""); // keepExistingData:true ensures we don’t clobber existing content
    } catch (e) {
      console.log(e);
    }
  });

})();
</script>
